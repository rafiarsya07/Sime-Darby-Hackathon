<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TownLoop Design Preview</title>
<meta name="description" content="TownLoop design preview for the Sime Darby Property University Hackathon 2026.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Funnel+Display:wght@500;600;700&family=Funnel+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1a1a1a;
    --mute: #8a8a86;
    --line: #e8e7e3;
    --grey: #f5f5f3;
    --stage: #eeeeec;
    --orange: #f26b2e;
    --max: 1320px;
    --gut: clamp(16px, 4vw, 48px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: "Funnel Sans", system-ui, sans-serif;
    color: var(--ink); background: #fff;
    -webkit-font-smoothing: antialiased;
  }
  img { display: block; width: 100%; height: auto; }
  a { color: inherit; text-decoration: none; }
  .wrap { max-width: var(--max); margin: 0 auto; padding: 0 var(--gut); }
  .zoom { cursor: zoom-in; }

  /* Top */
  .top { display: flex; align-items: center; justify-content: space-between; height: 76px; }
  .mark { display: flex; align-items: center; gap: 12px; font-family: "Funnel Display", sans-serif; font-weight: 600; font-size: 24px; letter-spacing: -.02em; }
  .mark svg { width: 38px; height: 24px; }
  .top nav { display: flex; gap: 32px; font-size: 15px; color: var(--mute); }
  .top nav a:hover { color: var(--ink); }

  /* Hero */
  .hero { padding: clamp(56px, 10vw, 128px) 0 clamp(40px, 6vw, 72px); }
  h1 {
    font-family: "Funnel Display", sans-serif; font-weight: 600;
    font-size: clamp(44px, 8.4vw, 124px); line-height: .96; letter-spacing: -.045em;
  }
  h1 em { font-style: normal; color: var(--orange); }
  .cta { display: inline-flex; align-items: center; gap: 10px; margin-top: clamp(24px, 3vw, 40px); height: 52px; padding: 0 24px; border-radius: 10px; background: var(--ink); color: #fff; font-size: 16px; font-weight: 600; }
  .cta:hover { background: #333; }
  .cta svg { width: 18px; height: 18px; }
  .top nav a.live { color: var(--ink); font-weight: 600; }

  .stage { background: var(--stage); }
  .stage .wrap { padding-top: clamp(16px, 3vw, 40px); padding-bottom: clamp(16px, 3vw, 40px); }

  /* Section head */
  section { padding-top: clamp(80px, 11vw, 152px); }
  .label {
    display: flex; justify-content: space-between; align-items: baseline;
    border-top: 1.5px solid var(--ink); padding-top: 18px; margin-bottom: clamp(28px, 4vw, 48px);
  }
  .label h2 { font-family: "Funnel Display", sans-serif; font-weight: 600; font-size: clamp(30px, 4vw, 52px); letter-spacing: -.03em; line-height: 1; }
  .label span { font-size: 15px; color: var(--mute); }

  /* App strip */
  .strip {
    display: grid; grid-auto-flow: column; grid-auto-columns: minmax(240px, 1fr);
    gap: clamp(12px, 1.6vw, 20px); overflow-x: auto; scroll-snap-type: x mandatory;
    padding-bottom: 8px; scrollbar-width: none;
  }
  .strip::-webkit-scrollbar { display: none; }
  @media (min-width: 1200px) { .strip { grid-auto-columns: 1fr; overflow: visible; } }
  .screen { scroll-snap-align: start; }
  .screen .shot { background: var(--grey); border-radius: 20px; padding: 18px 18px 0; overflow: hidden; }
  .screen img { border-radius: 14px 14px 0 0; box-shadow: 0 0 0 1px rgba(0,0,0,.05); transition: transform .4s cubic-bezier(.2,.7,.2,1); }
  .screen:hover img { transform: translateY(-6px); }
  .screen p { font-size: 15px; margin-top: 14px; }

  /* Bento */
  .grid { display: grid; gap: clamp(12px, 1.6vw, 20px); }
  .card { border: 1px solid var(--line); border-radius: 20px; overflow: hidden; background: #fff; }
  .card.fill { background: var(--grey); border-color: var(--grey); }
  .web { grid-template-columns: 1fr 340px; align-items: start; }
  .web .stack { display: grid; gap: clamp(12px, 1.6vw, 20px); }
  .web .dark { background: var(--ink); border-color: var(--ink); }
  .phone { position: sticky; top: 24px; background: var(--ink); border-radius: 36px; padding: 10px; }
  .phone .scroller { height: min(720px, calc(100vh - 68px)); border-radius: 28px; overflow-y: auto; background: #fff; scrollbar-width: none; }
  .phone .scroller::-webkit-scrollbar { display: none; }

  .brand { grid-template-columns: repeat(3, 1fr); }
  .brand .wide { grid-column: 1 / -1; }
  .brand .card { display: flex; align-items: center; }
  .icons { grid-template-columns: 1fr 2.34fr; margin-top: clamp(12px, 1.6vw, 20px); }
  .icons .wide { grid-column: 1 / -1; }

  /* Foot */
  footer { margin-top: clamp(96px, 12vw, 160px); border-top: 1px solid var(--line); }
  footer .wrap { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding-top: 28px; padding-bottom: 36px; font-size: 14px; color: var(--mute); flex-wrap: wrap; }

  /* Lightbox */
  .lb { position: fixed; inset: 0; z-index: 50; background: rgba(18,18,18,.94); display: none; overflow: auto; padding: 56px var(--gut); cursor: zoom-out; }
  .lb.open { display: block; }
  .lb img { max-width: 1440px; margin: 0 auto; border-radius: 12px; }
  .lb button { position: fixed; top: 14px; right: 14px; width: 42px; height: 42px; border-radius: 50%; border: 0; background: #fff; font-size: 22px; line-height: 1; cursor: pointer; color: var(--ink); }

  .rv { opacity: 0; transform: translateY(20px); transition: opacity .8s ease, transform .8s cubic-bezier(.2,.7,.2,1); }
  .rv.in { opacity: 1; transform: none; }

  @media (max-width: 1080px) {
    .web { grid-template-columns: 1fr; }
    .phone { position: static; max-width: 340px; width: 100%; justify-self: center; }
    .phone .scroller { height: 640px; }
    .brand { grid-template-columns: 1fr 1fr; }
    .brand .comp { grid-column: 1 / -1; }
  }
  @media (max-width: 720px) {
    .top nav { display: none; }
    .brand, .icons { grid-template-columns: 1fr; }
    .strip { grid-auto-columns: 72%; }
    .card, .screen .shot { border-radius: 14px; }
  }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    .rv { opacity: 1; transform: none; transition: none; }
    .screen img { transition: none; }
  }
</style>
</head>
<body>

<div class="wrap top">
  <a class="mark" href="#">
    <svg viewBox="0 0 38 24" fill="none" aria-hidden="true">
      <circle cx="12" cy="12" r="9.2" stroke="#1a1a1a" stroke-width="3.4"/>
      <circle cx="26" cy="12" r="9.2" stroke="#f26b2e" stroke-width="3.4"/>
    </svg>
    townloop
  </a>
  <nav>
    <a href="#app">App</a>
    <a href="#website">Website</a>
    <a href="#brand">Brand</a>
    <a class="live" href="demo/">Live demo</a>
  </nav>
</div>

<header class="wrap hero">
  <h1>Borrow from next door, <em>not from a store.</em></h1>
  <a class="cta" href="demo/">Try the live demo
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
  </a>
</header>

<div class="stage rv">
  <div class="wrap">
    <img class="zoom" src="design/00-app-screens-overview.png" alt="TownLoop app screens">
  </div>
</div>

<section id="app">
  <div class="wrap">
    <div class="label rv"><h2>App</h2><span>06</span></div>
    <div class="strip rv">
      <div class="screen"><div class="shot"><img class="zoom" src="design/03-siti-scans-and-signs-in.png" alt="Sign in" loading="lazy"></div><p>Sign in</p></div>
      <div class="screen"><div class="shot"><img class="zoom" src="design/04-tan-home.png" alt="Home" loading="lazy"></div><p>Home</p></div>
      <div class="screen"><div class="shot"><img class="zoom" src="design/05-tan-books-siti-washer.png" alt="Booking" loading="lazy"></div><p>Booking</p></div>
      <div class="screen"><div class="shot"><img class="zoom" src="design/06-siti-qr-handover.png" alt="QR handover" loading="lazy"></div><p>QR handover</p></div>
      <div class="screen"><div class="shot"><img class="zoom" src="design/07-tan-finds-a-gardener.png" alt="Get help" loading="lazy"></div><p>Get help</p></div>
      <div class="screen"><div class="shot"><img class="zoom" src="design/08-siti-eco-points.png" alt="Eco Points" loading="lazy"></div><p>Eco Points</p></div>
    </div>
  </div>
</section>

<section id="website">
  <div class="wrap">
    <div class="label rv"><h2>Website</h2><span>Desktop and mobile</span></div>
    <div class="grid web rv">
      <div class="stack">
        <div class="card"><img class="zoom" src="design/details/web-hero.png" alt="Website hero" loading="lazy"></div>
        <div class="card"><img class="zoom" src="design/details/web-how.png" alt="How it works" loading="lazy"></div>
        <div class="card fill"><img class="zoom" src="design/details/web-features.png" alt="Features" loading="lazy"></div>
        <div class="card"><img class="zoom" src="design/details/web-safety.png" alt="Safety" loading="lazy"></div>
        <div class="card"><img class="zoom" src="design/details/web-eco.png" alt="Eco Points" loading="lazy"></div>
        <div class="card dark"><img class="zoom" src="design/details/web-cta.png" alt="Call to action" loading="lazy"></div>
      </div>
      <div class="phone"><div class="scroller"><img src="design/10-website-mobile.png" alt="Website on mobile" loading="lazy"></div></div>
    </div>
  </div>
</section>

<section id="brand">
  <div class="wrap">
    <div class="label rv"><h2>Brand</h2><span>Moodboard and icons</span></div>
    <div class="grid brand rv">
      <div class="card wide"><img class="zoom" src="design/details/brand-wordmark.png" alt="Wordmark" loading="lazy"></div>
      <div class="card"><img class="zoom" src="design/details/brand-colour.png" alt="Colour" loading="lazy"></div>
      <div class="card"><img class="zoom" src="design/details/brand-type.png" alt="Type" loading="lazy"></div>
      <div class="card comp"><img class="zoom" src="design/details/brand-components.png" alt="Components" loading="lazy"></div>
      <div class="card wide"><img class="zoom" src="design/details/brand-principles.png" alt="Principles" loading="lazy"></div>
    </div>
    <div class="grid icons rv">
      <div class="card"><img class="zoom" src="design/details/icons-construction.png" alt="Logo construction" loading="lazy"></div>
      <div class="card"><img class="zoom" src="design/details/icons-feature.png" alt="Feature icons" loading="lazy"></div>
      <div class="card wide"><img class="zoom" src="design/details/icons-utility.png" alt="Utility icons" loading="lazy"></div>
    </div>
  </div>
</section>

<footer>
  <div class="wrap">
    <span>TownLoop</span>
    <span>Sime Darby Property University Hackathon 2026</span>
  </div>
</footer>

<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Enlarged image">
  <button type="button" aria-label="Close">&times;</button>
  <img alt="">
</div>

<script>
  const lb = document.getElementById('lb');
  const lbImg = lb.querySelector('img');
  document.querySelectorAll('.zoom').forEach(img => {
    img.addEventListener('click', () => {
      lbImg.src = img.src; lbImg.alt = img.alt;
      lb.classList.add('open'); lb.scrollTop = 0;
      document.body.style.overflow = 'hidden';
    });
  });
  const close = () => { lb.classList.remove('open'); document.body.style.overflow = ''; };
  lb.addEventListener('click', close);
  document.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });

  const io = 'IntersectionObserver' in window ? new IntersectionObserver(es => {
    es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } });
  }, { threshold: 0.08 }) : null;
  document.querySelectorAll('.rv').forEach(el => io ? io.observe(el) : el.classList.add('in'));
</script>
</body>
</html>
